name: Sync to GitHub

on:
  push:
    branches: [ main ] # 监听 GitCode 的 main 分支推送（需确保 GitCode 推送的是 main）

jobs:
  sync-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Git Config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Sync from GitCode
        run: |
          git remote add gitcode https://token:${{ secrets.cK7UGFpnAvHVcP_7EPxpiicK }}@gitcode.com/zuqiuxiaojiang/note.git
          git fetch gitcode
          git merge gitcode/main --no-edit || true
          git push origin main