<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOTE</title>

<!-- 禁止浏览器缓存，改了 data.js 刷新立即生效 -->
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">

<!-- 顺序不能变：先 CSS，再 config，再 data -->
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="data.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
 *  index.html —— 业务逻辑（密码 / 统计 / 排名 / 渲染）
 * ============================================================
 *
 *  【一般不用改这个文件】
 *  数据在 data.js，外观在 styles.css，名单/标准/密码在 config.js。
 *
 *  七部分：
 *    1. 密码验证（异步模态框，带"显示/隐藏"眼睛按钮）
 *    2. 工具函数
 *    3. 水分判定
 *    4. 排名算法
 *    5. 班组统计
 *    6. 渲染
 *    7. 启动
 * ============================================================ */

/* ============================================================
 *  第一部分：密码验证
 * ============================================================ */
function showPasswordGate() {
  return new Promise((resolve) => {
    const pw = REPORT_CONFIG.password;
    if (!pw || !pw.enabled) { resolve(); return; }

    const ui = pw.ui;
    const max = pw.maxAttempts || 3;
    let attempts = 0;

    // 是否显示眼睛按钮（showToggle 默认 true）
    const showToggle = pw.showToggle !== false;

    // ── 构建 DOM ──
    const overlay = document.createElement('div');
    overlay.className = 'pw-overlay';
    overlay.innerHTML = `
      <div class="pw-card" role="dialog" aria-modal="true" aria-labelledby="pw-title">
        <div class="pw-icon">🔒</div>
        <h2 class="pw-title" id="pw-title">${ui.title}</h2>
        <p class="pw-hint">${ui.hint}</p>
        <div class="pw-input-wrap">
          <input class="pw-input" type="password" placeholder="${ui.placeholder}"
                 autocomplete="off" spellcheck="false">
          ${showToggle ? `<button class="pw-eye" type="button"
                 title="${ui.showPassword}" aria-label="${ui.showPassword}">👁</button>` : ''}
        </div>
        <div class="pw-message info">${ui.attemptsText.replace('{remain}', max)}</div>
        <div class="pw-actions">
          <button class="pw-btn pw-btn-ghost" type="button">${ui.cancel}</button>
          <button class="pw-btn pw-btn-primary" type="button">${ui.submit}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const input   = overlay.querySelector('.pw-input');
    const message = overlay.querySelector('.pw-message');
    const btnOk   = overlay.querySelector('.pw-btn-primary');
    const btnBack = overlay.querySelector('.pw-btn-ghost');
    const eyeBtn  = overlay.querySelector('.pw-eye');   // 可能为 null

    // 预填（后门关键）
    if (pw.prefill) input.value = pw.prefill;

    // 自动聚焦
    setTimeout(() => {
      input.focus();
      if (pw.prefill) input.select();
    }, 50);

    // ── 眼睛按钮：点击切换 password / text ──
    if (eyeBtn) {
      // mousedown 时 preventDefault，避免输入框失焦（移动端软键盘不会收起）
      eyeBtn.addEventListener('mousedown', (e) => e.preventDefault());
      eyeBtn.addEventListener('click', () => {
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        eyeBtn.textContent = isHidden ? '🙈' : '👁';
        const label = isHidden ? ui.hidePassword : ui.showPassword;
        eyeBtn.title = label;
        eyeBtn.setAttribute('aria-label', label);
        input.focus();
        // 光标移到末尾
        try {
          const len = input.value.length;
          input.setSelectionRange(len, len);
        } catch (e) {}
      });
    }

    // ── 工具函数 ──
    function setMessage(text, type = 'info') {
      message.textContent = text;
      message.className = 'pw-message ' + type;
    }
    function shake() {
      input.classList.remove('error');
      void input.offsetWidth;
      input.classList.add('error');
      setTimeout(() => input.classList.remove('error'), 500);
    }
    function fadeOutAndRedirect() {
      overlay.style.transition = 'opacity 0.2s';
      overlay.style.opacity = '0';
      setTimeout(() => { window.location.replace(pw.failRedirect); }, 200);
    }

    // ── 提交 ──
    function submit() {
      const val = input.value;
      const allowEmpty = pw.accept.includes('');

      if (!val && !allowEmpty) {
        setMessage(ui.errorEmpty, 'error');
        shake();
        return;
      }

      if (pw.accept.includes(val)) {
        overlay.style.transition = 'opacity 0.2s';
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.remove();
          resolve();
        }, 200);
        return;
      }

      // 错误
      attempts++;
      const remain = max - attempts;
      input.value = '';
      input.focus();

      if (remain <= 0) {
        setMessage(ui.errorExhausted, 'error');
        shake();
        input.disabled = true;
        btnOk.disabled = true;
        if (eyeBtn) eyeBtn.disabled = true;
        setTimeout(fadeOutAndRedirect, 1200);
        return;
      }

      setMessage(`${ui.errorWrong} · ${ui.attemptsText.replace('{remain}', remain)}`, 'error');
      shake();
    }

    // ── 事件绑定 ──
    btnOk.addEventListener('click', submit);

    btnBack.addEventListener('click', () => {
      setMessage(ui.cancelled, 'error');
      setTimeout(fadeOutAndRedirect, 400);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      else if (e.key === 'Escape') { e.preventDefault(); btnBack.click(); }
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) btnBack.click();
    });
  });
}

/* ============================================================
 *  第二部分：工具函数
 * ============================================================ */
function cleanNumber(v) {
  if (v === undefined || v === null) return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;
  if (typeof v !== 'string') return null;
  const s = v.trim().replace(/^["'‘’"“”]+|["'‘’"“”]+$/g, '').replace(/[,，]/g, '');
  const m = s.match(/^-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function safeNum(p, k) { const v = cleanNumber(p[k]); return v !== null ? v : 0; }
function hasAnyData(p) {
  return ['蒸汽消耗', '糖浆加量', '水消耗', '电消耗'].some(k => cleanNumber(p[k]) !== null);
}
function formatNum(v) {
  if (v === undefined || v === null || v === '' || v === '-') return '-';
  const n = parseFloat(v);
  if (isNaN(n)) return String(v);
  return n.toFixed(4).replace(/\.?0+$/, '');
}

/* ============================================================
 *  第三部分：水分判定
 * ============================================================ */
const IC = REPORT_CONFIG.icons;
function getWaterStatus(val) {
  const use123 = REPORT_CONFIG.waterStandard === 1
              || (REPORT_CONFIG.waterStandard === 0 && val <= 5);
  if (use123) {
    if (val === 2) return [IC.waterOk, 0];
    return val < 2 ? [IC.waterLow, -5] : [IC.waterHigh, -10];
  }
  if (val >= 10.5 && val <= 11.5) return [IC.waterOk, 0];
  return val < 10.5 ? [IC.waterLow, -5] : [IC.waterHigh, -10];
}
function formatWater(m) {
  const v = cleanNumber(m);
  if (v === null) return IC.waterOk;
  if (v === 0) return IC.waterNone;
  return getWaterStatus(v)[0];
}
function calcWaterScore(m) {
  const v = cleanNumber(m);
  if (v === null || v === 0) return 0;
  return getWaterStatus(v)[1];
}

/* ============================================================
 *  第四部分：排名算法
 * ============================================================ */
function rank(list, key, asc = true) {
  const nums = list.filter(x => typeof x[1][key] === 'number').map(x => x[1][key]);
  const uniq = [...new Set(nums)].sort((a, b) => asc ? a - b : b - a);
  const map = {};
  uniq.forEach((v, i) => map[v] = i + 1);
  return map;
}

/* ============================================================
 *  第五部分：班组统计
 * ============================================================ */
function calcTeamStats(data) {
  const stats = {}, repairs = [];
  for (const team of REPORT_CONFIG.teams) {
    const rows = data.filter(p => p.班组 === team)
                     .sort((a, b) => String(a.日期 || '').localeCompare(String(b.日期 || '')));
    if (!rows.length) continue;

    let 蒸汽 = 0, 糖浆 = 0, 水 = 0, 电 = 0;
    let 正常班数 = 0, 扣分 = 0, 合格数 = 0, 检维修数 = 0;
    const 明细 = [];

    for (const p of rows) {
      const isRepair = p.类型 === '检维修';
      const hasData = hasAnyData(p) && !isRepair;

      if (hasData) {
        蒸汽 += safeNum(p, '蒸汽消耗');
        糖浆 += safeNum(p, '糖浆加量');
        水   += safeNum(p, '水消耗');
        电   += safeNum(p, '电消耗');
        正常班数++;
      }
      if (isRepair) {
        检维修数++;
        repairs.push({ 班组: team, 日期: p.日期 || '-' });
      }

      const s = calcWaterScore(p.水分);
      扣分 += s;
      if (hasData && s === 0 && cleanNumber(p.水分) !== 0) 合格数++;

      明细.push(isRepair
        ? { 日期: p.日期 || '-', 类型: IC.repair, 蒸汽: '-', 糖浆: '-', 水: '-', 电: '-', 水分: formatWater(p.水分) }
        : { 日期: p.日期 || '-', 类型: IC.normal,
            蒸汽: formatNum(p.蒸汽消耗), 糖浆: formatNum(p.糖浆加量),
            水: formatNum(p.水消耗),     电: formatNum(p.电消耗),
            水分: formatWater(p.水分) });
    }

    stats[team] = {
      蒸汽, 糖浆, 水, 电, 扣分, 班数: 正常班数, 检维修数, 合格数,
      比:   糖浆 ? +(蒸汽 / 糖浆).toFixed(4) : '-',
      水均: 正常班数 ? +(水 / 正常班数).toFixed(4) : '-',
      电均: 正常班数 ? +(电 / 正常班数).toFixed(4) : '-',
      工艺分: 正常班数 ? +(REPORT_CONFIG.processBaseScore / 正常班数 * 合格数).toFixed(4) : 0,
      明细,
    };
  }
  return { stats, repairs };
}

function calcRankings(stats) {
  const list = REPORT_CONFIG.teams.map(t => [t, stats[t]]).filter(x => x[1]);
  const rB = rank(list, '比'), rW = rank(list, '水均'), rE = rank(list, '电均');
  list.forEach(([, s]) => {
    s.排名比 = rB[s.比] || '-';
    s.排名水 = rW[s.水均] || '-';
    s.排名电 = rE[s.电均] || '-';
    s.积分 = (s.排名比 === '-' ? 0 : s.排名比)
           + (s.排名水 === '-' ? 0 : s.排名水)
           + (s.排名电 === '-' ? 0 : s.排名电);
  });
  const rS = rank(list, '积分');
  list.forEach(([, s]) => { s.总排名 = rS[s.积分] || '-'; });
  return list;
}

/* ============================================================
 *  第六部分：渲染
 * ============================================================ */
const h = (tag, attrs = {}, children = []) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  for (const c of [].concat(children)) {
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
};
function makeTable(headRow, rows) {
  const t = h('table');
  t.appendChild(h('thead', {}, h('tr', {}, headRow.map(x => h('th', {}, x)))));
  t.appendChild(h('tbody', {}, rows.map(r => h('tr', {}, r.map(c => h('td', {}, c))))));
  return t;
}

function renderHeader() {
  const app = document.getElementById('app');
  const h1 = h('h1');
  h1.appendChild(h('img', { src: REPORT_CONFIG.headerImage, alt: '', class: 'inline-image' }));
  h1.appendChild(h('span', { class: 'inline-title' }, REPORT_CONFIG.title));
  app.appendChild(h1);

  const nav = h('h3');
  REPORT_CONFIG.navLinks.forEach(l => nav.appendChild(h('a', { href: l.url }, l.text)));
  app.appendChild(nav);
}

function renderLegend() {
  const app = document.getElementById('app');
  app.appendChild(h('h2', {}, '📖 图例说明'));
  const t = makeTable(['符号', '含义'], [
    [IC.normal,    '正常班'],
    [IC.repair,    '检维修'],
    [IC.waterOk,   '水分合格'],
    [IC.waterLow,  '水分偏干（扣5分）'],
    [IC.waterHigh, '水分偏潮（扣10分）'],
    [IC.waterNone, '无料样（不参与水分计算）'],
  ]);
  t.className = 'legend';
  app.appendChild(t);
}

function renderAll(data) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  renderHeader();
  renderLegend();

  const { stats, repairs } = calcTeamStats(data);
  const list = calcRankings(stats);

  app.appendChild(h('h2', {}, '📊 消耗统计汇总'));
  app.appendChild(makeTable(
    ['班组', '蒸汽用量', '糖浆加量', '水量', '电量', '水分扣分'],
    list.map(([t, s]) => [t, formatNum(s.蒸汽), formatNum(s.糖浆), formatNum(s.水), formatNum(s.电), String(s.扣分)])
  ));

  app.appendChild(h('h2', {}, '📈 平均分'));
  app.appendChild(makeTable(
    ['班组', '蒸汽÷糖浆', '水量÷正常班', '电量÷正常班', '工艺分'],
    list.map(([t, s]) => [t, formatNum(s.比), formatNum(s.水均), formatNum(s.电均), formatNum(s.工艺分)])
  ));

  app.appendChild(h('h2', {}, '🏆 积分排名'));
  app.appendChild(makeTable(
    ['班组', '蒸汽÷糖浆排名', '水消耗排名', '电消耗排名', '各班积分', '最低消耗排名'],
    list.map(([t, s]) => [t, String(s.排名比), String(s.排名水), String(s.排名电), String(s.积分), String(s.总排名)])
  ));

  if (repairs.length) {
    app.appendChild(h('h2', {}, '🔧 检维修记录'));
    app.appendChild(makeTable(['班组', '日期'], repairs.map(r => [r.班组, r.日期])));
  }

  app.appendChild(h('h2', {}, '📋 各班明细'));
  for (const team of REPORT_CONFIG.teams) {
    const s = stats[team]; if (!s) continue;
    app.appendChild(h('h3', {}, `${team}（${s.班数 + s.检维修数}）`));
    const rows = s.明细.map(d => [d.日期, d.类型, d.蒸汽, d.糖浆, d.水, d.电, d.水分]);
    rows.push(['小计', `${IC.normal}:${s.班数} | ${IC.repair}:${s.检维修数}`,
      formatNum(s.蒸汽), formatNum(s.糖浆), formatNum(s.水), formatNum(s.电), String(s.扣分)]);
    app.appendChild(makeTable(['日期', '类型', '蒸汽消耗', '糖浆加量', '水消耗', '电消耗', '水分'], rows));
  }
}

/* ============================================================
 *  第七部分：启动
 * ============================================================ */
showPasswordGate().then(() => {
  if (typeof PRODUCTION_DATA === 'undefined') {
    document.getElementById('app').textContent =
      '❌ data.js 未加载或格式错误，请打开 F12 控制台查看报错。';
  } else {
    renderAll(PRODUCTION_DATA);
  }
});
</script>
</body>
</html>
